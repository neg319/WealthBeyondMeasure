name: Build and Package RimWorld Mod

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore RimWorld references
        shell: pwsh
        env:
          RW_MANAGED_ZIP_B64: ${{ secrets.RW_MANAGED_ZIP_B64 }}
          RW_ASSEMBLY_CSHARP_B64: ${{ secrets.RW_ASSEMBLY_CSHARP_B64 }}
          RW_UNITYENGINE_COREMODULE_B64: ${{ secrets.RW_UNITYENGINE_COREMODULE_B64 }}
          RW_UNITYENGINE_IMGUIMODULE_B64: ${{ secrets.RW_UNITYENGINE_IMGUIMODULE_B64 }}
          RW_UNITYENGINE_TEXTRENDERINGMODULE_B64: ${{ secrets.RW_UNITYENGINE_TEXTRENDERINGMODULE_B64 }}
          RW_UNITYENGINE_ASSETBUNDLEMODULE_B64: ${{ secrets.RW_UNITYENGINE_ASSETBUNDLEMODULE_B64 }}
        run: ./scripts/restore-rimworld-refs.ps1

      - name: Restore NuGet packages
        run: dotnet restore WealthBeyondMeasure/Source/WealthBeyondMeasure/WealthBeyondMeasure.csproj

      - name: Build mod assembly
        run: dotnet build WealthBeyondMeasure/Source/WealthBeyondMeasure/WealthBeyondMeasure.csproj --configuration Release --no-restore

      - name: Package mod zip
        shell: pwsh
        run: ./scripts/package-mod.ps1

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: WealthBeyondMeasure-mod
          path: out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged mod
        uses: actions/download-artifact@v4
        with:
          name: WealthBeyondMeasure-mod
          path: out

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/*.zip --generate-notes --latest
